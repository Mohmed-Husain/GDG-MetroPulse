# MetroPulse Configuration for Stadium Surge Planner (PS-05)
# All parameters marked with ESTIMATE or UNKNOWN are logged in ASSUMPTIONS.md

station:
  default_station_id: "STN_15"
  default_station_name: "Motera Stadium"
  platform_area_m2: 2100               # from network.csv (140m x 15m)
  usable_platform_fraction: 0.60       # ESTIMATE: stairs, pillars, screen door buffers reduce standing area
  hold_threshold_density: 2.0          # pax/m2 from policy.yaml (LOS_E concourse holding)
  resume_threshold_density: 1.5        # pax/m2 hysteresis cutoff to resume gate flow
  critical_density: 3.5                # pax/m2 ESTIMATE: severe hazard threshold (policy crush is 6.0)
  entry_gates_total: 10                # ESTIMATE: automatic fare collection entry gates
  regular_gate_rate_pax_min: 25        # ESTIMATE: standard smart card / token throughput
  qr_event_gate_multiplier: 1.3        # ESTIMATE: pre-scanned event QR paper ticket throughput
  forecourt_capacity_pax: 8000         # ESTIMATE: outdoor holding pens & plaza
  concourse_capacity_pax: 3500         # ESTIMATE: mezzanine concourse queue area before turnstiles
  walk_time_venue_to_gates_min: 5      # ESTIMATE: direct pedestrian flyover walk time
  rain_walk_multiplier: 1.4            # ESTIMATE: walking pace slows under rainfall

demand:
  direction_split_southbound: 0.55     # ESTIMATE: towards Ahmedabad / APMC
  direction_split_northbound: 0.45     # ESTIMATE: towards Gandhinagar
  egress_distribution:
    pre_t0_fraction: 0.10              # ESTIMATE: leaves in last 15 min before T0 (T-15 to T0)
    main_surge_fraction: 0.70          # ESTIMATE: leaves in T0 to T+40
    main_surge_peak_min: 15            # ESTIMATE: egress peak occurs at T+15
    tail_fraction: 0.20                # ESTIMATE: dispersed tail departures up to T+120
    rain_compression_factor: 1.25      # ESTIMATE: rain causes faster exit from open-air stands

rolling_stock:
  coaches_per_rake: 3
  comfort_capacity_total: 450          # 136 seated + 314 standing @ 3 pax/m2 (rolling_stock.yaml)
  comfort_load_factor: 0.85            # policy.yaml max allowable comfort loading
  max_boarders_per_train: 382          # ceil(450 * 0.85)
  arrival_load_fraction: 0.25          # ESTIMATE: trains arriving carry 25% passenger load at night
  doors_per_side: 12                   # 4 dual doors per coach * 3 coaches
  door_flow_pax_per_sec: 1.3           # pax/sec benchmark per 1.4m dual door
  standard_dwell_sec: 30               # timetable standard dwell
  extended_dwell_sec: 60               # matchday extended dwell limit (rolling_stock.yaml)
  cbtc_min_headway_sec: 90             # signalling design limit
  practical_min_headway_min: 3         # operational safe floor parameter
  default_standby_rakes: 4             # from precedents.csv
  fleet_available_for_service: 26      # rolling_stock.yaml
  turnback_station_south: "STN_12"     # Sabarmati Railway Station (ESTIMATE ASSUMPTION: needs operator confirmation)
  turnback_station_north: "STN_23"     # GNLU (policy.yaml allowed short-turn point)
  shuttle_round_trip_min_south: 18     # ESTIMATE: run time + dwell + turnback
  shuttle_round_trip_min_north: 22     # ESTIMATE: run time + dwell + turnback

optimizer:
  time_horizon_min: 270                # T-30 to T+240 (271 minutes total)
  block_size_min: 15                   # min_time_between_plan_changes_min from policy.yaml
  headway_options: [3, 4, 5, 6]        # allowed headway levers
  weight_clearance: 1.0
  weight_hold_minutes: 50.0
  weight_rakes_used: 10.0
  monte_carlo_runs: 120                # sampled runs for uncertainty band
